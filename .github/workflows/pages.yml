name: Deploy landing and talks to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'ignite-build/**'
      - 'think-like-a-system/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Armar el sitio (landing + charlas)
        run: |
          mkdir _site
          cp -R web/. _site/
          mkdir _site/charlamajo1rosario
          cp -R ignite-build/. _site/charlamajo1rosario/
          rm -f _site/charlamajo1rosario/README.md
          mkdir _site/charlamajo2rosario
          cp -R think-like-a-system/. _site/charlamajo2rosario/
          rm -f _site/charlamajo2rosario/README.md

      - name: Subir el sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
